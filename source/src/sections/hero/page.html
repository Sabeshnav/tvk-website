<title>TVK Flag Hoist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&family=Catamaran:wght@800;900&display=swap">
<style>
/* Layout: a tall scroll track drives one sticky full-screen stage (WebGL flag + light + grain) */
:root{
  --bg-0:#0d0206; --bg-1:#2c060c; --bg-2:#5a0d16; --gold:#ffca00; --gold-hi:#ffe08a; --red:#a00000;
  --ink:#fff6e3; --ink-dim:rgba(255,246,227,.72);
  --f-en:"Archivo","Arial Black",system-ui,sans-serif; --f-ta:"Catamaran","Noto Sans Tamil",system-ui,sans-serif;
  color-scheme:dark;
}
html{scrollbar-width:thin;scrollbar-color:var(--gold) var(--bg-0)}
body{margin:0;background:var(--bg-0);color:var(--ink);font-family:var(--f-en)}
#track{position:relative;height:520svh}
.sticky{position:sticky;top:0;height:100svh;overflow:hidden;
  background:radial-gradient(60% 70% at 62% 30%,#6e1018 0%,var(--bg-2) 22%,var(--bg-1) 55%,var(--bg-0) 100%)}
/* a soft shaft of light from above, behind the flag */
.sticky::before{content:"";position:absolute;inset:-20% 0 0 0;pointer-events:none;
  background:conic-gradient(from 180deg at 62% -8%,transparent 0deg,rgba(255,214,120,.0) 160deg,rgba(255,214,120,.16) 176deg,rgba(255,214,120,.22) 180deg,rgba(255,214,120,.16) 184deg,rgba(255,214,120,0) 200deg,transparent 360deg);
  opacity:.75}
#stage{position:absolute;inset:0}
#stage canvas{display:block;width:100%;height:100%}
/* film grain + vignette for the edit look */
.grain{position:absolute;inset:-50%;pointer-events:none;opacity:.035;will-change:transform;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  animation:grain 1s steps(6) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,3%)}80%{transform:translate(3%,1%)}100%{transform:translate(0,0)}}
.sil{position:absolute;left:0;bottom:0;pointer-events:none;will-change:transform}
.sil-hills{opacity:.85}
.sil-fg{}
.sil-glow{position:absolute;left:-10%;right:-10%;bottom:12%;height:58%;pointer-events:none;will-change:transform,opacity;
  background:radial-gradient(55% 75% at 50% 100%,rgba(255,170,72,.5),rgba(255,120,48,.2) 38%,rgba(200,60,30,.05) 65%,transparent 80%)}

.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 95% at 55% 45%,transparent 55%,rgba(0,0,0,.6) 100%)}

.title{--p:0;position:absolute;z-index:3;left:clamp(20px,7vw,110px);top:50%;translate:0 -50%;max-width:min(46vw,640px);display:grid;gap:clamp(10px,1.6vw,18px);pointer-events:none}
.title .kicker{font:800 clamp(11px,1vw,13px)/1.2 var(--f-en);letter-spacing:.34em;text-transform:uppercase;color:var(--gold-hi);
  opacity:var(--p);transform:translateX(calc((1 - var(--p)) * -40px))}
.title h1{margin:0;font:900 clamp(40px,5.6vw,92px)/1.06 var(--f-ta);color:var(--gold);text-wrap:balance;
  text-shadow:0 3px 0 #3a080e,0 12px 40px rgba(0,0,0,.45);
  opacity:var(--p);transform:translateX(calc((1 - var(--p)) * -70px));filter:blur(calc((1 - var(--p)) * 8px))}
.title h1 span{display:inline-block;white-space:nowrap}
.title .rule{height:3px;width:calc(var(--p) * min(240px,40vw));background:linear-gradient(90deg,var(--gold),rgba(255,202,0,0))}
.title .slogan{font:800 clamp(17px,1.7vw,24px)/1.4 var(--f-ta);color:var(--ink);opacity:var(--p);transform:translateY(calc((1 - var(--p)) * 18px))}
.title .slogan em{display:block;font:600 clamp(13px,1.1vw,15px)/1.4 var(--f-en);font-style:normal;letter-spacing:.06em;color:var(--ink-dim)}

.cue{position:absolute;z-index:3;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);translate:-50% 0;display:grid;justify-items:center;gap:8px;
  font:800 11px/1 var(--f-en);letter-spacing:.32em;text-transform:uppercase;color:var(--gold-hi);transition:opacity .3s}
.cue i{display:block;width:2px;height:34px;background:linear-gradient(var(--gold),transparent);animation:cue 1.6s ease-in-out infinite}
@keyframes cue{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
.tag{position:absolute;z-index:3;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);font:600 11px/1.3 var(--f-en);color:rgba(255,246,227,.45);letter-spacing:.04em}

@media (max-width:860px), (max-aspect-ratio:9/10){
  .title{left:clamp(52px,14vw,72px);right:18px;top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 54px);translate:0 0;max-width:none;text-align:left}
  .title h1{font-size:min(11vw,54px)}
  /* a soft dark fade behind the title so the cheering crowd doesn't fight the text */
  .title::before{content:"";position:absolute;z-index:-1;left:-80px;right:-30px;top:-70px;bottom:-90px;opacity:var(--p);
    background:linear-gradient(180deg,rgba(10,2,4,0) 0%,rgba(10,2,4,.3) 42%,rgba(6,1,2,.82) 100%)}
}
@media (prefers-reduced-motion:reduce){.grain,.cue i{animation:none}}
</style>
<div id="track">
  <div class="sticky">
    <div id="stage" aria-label="The TVK flag is hoisted up a brass pole as you scroll"></div>
    <div class="grain" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>
    <div class="title" id="title">
      <p class="kicker">Tamilaga Vettri Kazhagam</p>
      <h1 lang="ta"><span>தமிழக</span> <span>வெற்றிக்</span> <span>கழகம்</span></h1>
      <div class="rule" aria-hidden="true"></div>
      <p class="slogan"><span lang="ta">பிறப்பொக்கும் எல்லா உயிர்க்கும்</span><em>All are equal by birth</em></p>
    </div>
    <div class="cue" id="cue" aria-hidden="true"><span>Scroll to hoist</span><i></i></div>
    <div class="tag">POC · concept, not an official TVK website</div>
  </div>
</div>
<script>/*INLINE_JS*/</script>
